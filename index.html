<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Omaha Hutchinson Point Trainer</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:980px;margin:30px auto;padding:0 16px;line-height:1.4}
    h1{margin-bottom:4px}
    .card{border:1px solid #ddd;border-radius:10px;padding:16px;margin:16px 0}
    select,button{font-size:16px;padding:8px;margin:4px}
    button{cursor:pointer}
    .hand{font-size:28px;margin:12px 0}
    .red{color:#b00020}.black{color:#111}
    .good{color:green;font-weight:bold}.bad{color:#b00020;font-weight:bold}
    .breakdown{white-space:pre-wrap;background:#f7f7f7;padding:12px;border-radius:8px}
    .answers button{display:block;width:220px;text-align:left;margin:8px 0}
  </style>
</head>
<body>
<h1>Omaha Hutchinson Point Trainer</h1>
<p>Enter a four-card Omaha hand or use quiz mode.</p>

<div class="card">
  <h2>Score a Hand</h2>
  <div id="selectors"></div>
  <button onclick="scoreSelected()">Score Hand</button>
  <button onclick="randomizeHand()">Random Hand</button>
  <div id="scoreOut"></div>
</div>

<div class="card">
  <h2>Quiz Mode</h2>
  <button onclick="newQuiz()">New Question</button>
  <div id="quizOut"></div>
</div>

<div class="card">
  <h2>Built-in Test Cases</h2>
  <button onclick="runTests()">Run Tests</button>
  <div id="testOut"></div>
</div>

<script>
const ranks = ["A","K","Q","J","T","9","8","7","6","5","4","3","2"];
const rankVal = {A:14,K:13,Q:12,J:11,T:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2};
const suits = ["♠","♥","♦","♣"];
const redSuits = new Set(["♥","♦"]);

function cardText(c){
  return `<span class="${redSuits.has(c.suit) ? 'red':'black'}">${c.rank}${c.suit}</span>`;
}

function makeDeck(){
  const d=[];
  for(const r of ranks) for(const s of suits) d.push({rank:r,suit:s});
  return d;
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function randomHand(){
  return shuffle(makeDeck()).slice(0,4);
}

function suitHeadPoints(rank){
  if(rank==="A") return 8;
  if(rank==="K") return 6;
  if(rank==="Q") return 5;
  if(rank==="J") return 4;
  if(rank==="T" || rank==="9") return 3;
  if(rank==="8") return 2;
  return 1;
}

function pairPoints(rank){
  return {A:18,K:16,Q:14,J:13,T:12,9:10,8:8,7:7,6:7,5:7,4:7,3:7,2:7}[rank];
}

function combos(arr,k){
  const out=[];
  function rec(start,cur){
    if(cur.length===k){out.push(cur.slice());return;}
    for(let i=start;i<arr.length;i++){
      cur.push(arr[i]); rec(i+1,cur); cur.pop();
    }
  }
  rec(0,[]);
  return out;
}

function gapsFor(vals){
  const sorted=[...vals].sort((a,b)=>a-b);
  return (sorted[sorted.length-1]-sorted[0])-(sorted.length-1);
}

function straightCandidateScore(vals, usesAce, aceHighBroadway){
  const n=vals.length;
  const base = n===4 ? 25 : n===3 ? 18 : 8;
  const gaps = gapsFor(vals);
  if(gaps > 3) return null;
  let score = base - Math.min(6, gaps*2);

  // This matches the posted examples:
  // AAKK gets A-K = 4 because 8 - 4 ace penalty.
  // AKQT gets 23, because the original example does NOT apply the ace penalty there.
  // A34 gets 12 because 18 - 2 gap - 4 ace penalty.
  if(usesAce && !aceHighBroadway) score -= 4;

  return {score, gaps};
}

function straightPoints(cards){
  const uniqueRanks = [...new Set(cards.map(c=>c.rank))];
  const candidates=[];

  for(const n of [4,3,2]){
    for(const rs of combos(uniqueRanks,n)){
      const hasAce = rs.includes("A");

      // Normal high-ace version.
      let highVals = rs.map(r=>rankVal[r]);
      let highBroadway = hasAce && Math.min(...highVals) >= 10;
      let high = straightCandidateScore(highVals, hasAce, highBroadway);
      if(high && high.score > 0){
        candidates.push({
          ranks: rs.slice(),
          label: rs.join("-"),
          size:n,
          score:high.score,
          gaps:high.gaps,
          aceMode: hasAce ? "high" : "none",
          key: rs.slice().sort().join("")
        });
      }

      // Low-ace wheel version.
      if(hasAce){
        let lowVals = rs.map(r=>r==="A" ? 1 : rankVal[r]);
        let low = straightCandidateScore(lowVals, true, false);
        if(low && low.score > 0){
          candidates.push({
            ranks: rs.slice(),
            label: rs.join("-") + " wheel",
            size:n,
            score:low.score,
            gaps:low.gaps,
            aceMode:"low",
            key: rs.slice().sort().join("")
          });
        }
      }
    }
  }

  // Remove duplicate same-rank-set candidates, keep best version.
  const bestByKey = new Map();
  for(const c of candidates){
    const old = bestByKey.get(c.key);
    if(!old || c.score > old.score) bestByKey.set(c.key,c);
  }

  let clean = [...bestByKey.values()]
    .sort((a,b)=>b.size-a.size || b.score-a.score);

  // Count only maximal structures, so AKQT scores once as 23,
  // not also every 3-card and 2-card subset.
  const chosen=[];
  for(const c of clean){
    const cset = new Set(c.ranks);
    let contained = false;
    for(const p of chosen){
      const pset = new Set(p.ranks);
      let allIn = true;
      for(const r of cset) if(!pset.has(r)) allIn=false;
      if(allIn){contained=true;break;}
    }
    if(!contained) chosen.push(c);
  }

  const total = chosen.reduce((s,c)=>s+c.score,0);
  return {total, chosen};
}

function scoreHand(cards){
  let total=0;
  let lines=[];

  lines.push("HAND: " + cards.map(c=>c.rank+c.suit).join(" "));

  // Suited points.
  let suitTotal=0;
  lines.push("\\nSUITED CARDS:");
  for(const s of suits){
    const suited = cards.filter(c=>c.suit===s);
    if(suited.length >= 2){
      suited.sort((a,b)=>rankVal[b.rank]-rankVal[a.rank]);
      const pts = suitHeadPoints(suited[0].rank);
      suitTotal += pts;
      lines.push(`${s}: ${suited.map(c=>c.rank+c.suit).join(" ")} headed by ${suited[0].rank} = +${pts}`);
      if(suited.length > 2){
        suitTotal -= 2;
        lines.push(`${s}: more than two cards of same suit = -2`);
      }
    }
  }
  if(suitTotal===0) lines.push("No suited holding = +0");
  total += suitTotal;

  // Pair points.
  let pairTotal=0;
  lines.push("\\nPAIRS:");
  const counts={};
  for(const c of cards) counts[c.rank]=(counts[c.rank]||0)+1;

  const hasTripsOrQuads = Object.values(counts).some(n=>n>=3);
  if(hasTripsOrQuads){
    lines.push("Hand contains three or more of one rank, so pair section scores +0");
  } else {
    for(const r of ranks){
      if(counts[r]===2){
        const pts=pairPoints(r);
        pairTotal += pts;
        lines.push(`Pair of ${r}s = +${pts}`);
      }
    }
    if(pairTotal===0) lines.push("No pair = +0");
  }
  total += pairTotal;

  // Straight/connectedness.
  lines.push("\\nCONNECTEDNESS:");
  const st = straightPoints(cards);
  if(st.chosen.length===0){
    lines.push("No qualifying 2, 3, or 4 card straight structure = +0");
  } else {
    for(const c of st.chosen){
      const base = c.size===4 ? 25 : c.size===3 ? 18 : 8;
      let line = `${c.label}: ${c.size} cards base ${base}`;
      if(c.gaps) line += `, ${c.gaps} gap(s) = -${Math.min(6,c.gaps*2)}`;
      const usesAcePenalty = c.ranks.includes("A") && !(c.aceMode==="high" && c.ranks.every(r=>rankVal[r]>=10));
      if(usesAcePenalty) line += `, ace penalty = -4`;
      line += ` => +${c.score}`;
      lines.push(line);
    }
  }
  total += st.total;

  lines.push(`\\nTOTAL: ${total} points`);
  lines.push(`Approx win % in 10-handed all-in simulation: ${(total/2).toFixed(1)}%`);
  lines.push(total>=32 ? "Guideline: playable / consider raising." :
             total>=28 ? "Guideline: playable call threshold." :
             "Guideline: below suggested playable threshold.");

  return {total, breakdown:lines.join("\\n")};
}

function buildSelectors(){
  const wrap=document.getElementById("selectors");
  wrap.innerHTML="";
  for(let i=0;i<4;i++){
    const r=document.createElement("select");
    r.id="r"+i;
    for(const x of ranks){
      const o=document.createElement("option");
      o.value=x;o.textContent=x;r.appendChild(o);
    }
    const s=document.createElement("select");
    s.id="s"+i;
    for(const x of suits){
      const o=document.createElement("option");
      o.value=x;o.textContent=x;s.appendChild(o);
    }
    wrap.appendChild(r);wrap.appendChild(s);
  }
}

function selectedHand(){
  const hand=[];
  const seen=new Set();
  for(let i=0;i<4;i++){
    const c={rank:document.getElementById("r"+i).value, suit:document.getElementById("s"+i).value};
    const k=c.rank+c.suit;
    if(seen.has(k)) throw new Error("Duplicate card: "+k);
    seen.add(k);
    hand.push(c);
  }
  return hand;
}

function setHand(hand){
  for(let i=0;i<4;i++){
    document.getElementById("r"+i).value=hand[i].rank;
    document.getElementById("s"+i).value=hand[i].suit;
  }
}

function scoreSelected(){
  const out=document.getElementById("scoreOut");
  try{
    const hand=selectedHand();
    const r=scoreHand(hand);
    out.innerHTML = `<div class="hand">${hand.map(cardText).join(" ")}</div>
      <h3>${r.total} points</h3>
      <div class="breakdown">${r.breakdown}</div>`;
  }catch(e){
    out.innerHTML = `<p class="bad">${e.message}</p>`;
  }
}

function randomizeHand(){
  setHand(randomHand());
  scoreSelected();
}

let currentQuiz=null;

function plausibleAnswers(correct){
  const set=new Set([correct]);
  const offsets=[-8,-6,-4,-3,-2,2,3,4,6,8,10,-10];
  shuffle(offsets);
  for(const off of offsets){
    if(set.size>=4) break;
    const v=Math.max(0,correct+off);
    if(v!==correct) set.add(v);
  }
  while(set.size<4) set.add(Math.max(0, correct + Math.floor(Math.random()*17)-8));
  return shuffle([...set]);
}

function newQuiz(){
  const hand=randomHand();
  const r=scoreHand(hand);
  currentQuiz={hand,score:r.total,breakdown:r.breakdown};
  const answers=plausibleAnswers(r.total);
  document.getElementById("quizOut").innerHTML =
    `<div class="hand">${hand.map(cardText).join(" ")}</div>
     <p>What is the Hutchinson point value?</p>
     <div class="answers">
       ${answers.map(a=>`<button onclick="answerQuiz(${a})">${a} points</button>`).join("")}
     </div>
     <div id="quizResult"></div>`;
}

function answerQuiz(a){
  const ok=a===currentQuiz.score;
  document.getElementById("quizResult").innerHTML =
    `<p class="${ok?'good':'bad'}">${ok ? "Correct." : "Wrong."} Actual score: ${currentQuiz.score}</p>
     <div class="breakdown">${currentQuiz.breakdown}</div>`;
}

function handFrom(str){
  const parts=str.trim().split(/\s+/);
  return parts.map(p=>({rank:p[0],suit:p.slice(1)}));
}

function runTests(){
  const tests=[
    ["A♠ K♠ A♥ K♥",54,"AAKK double suited"],
    ["9♠ 8♠ 9♦ 8♦",32,"9988 double suited"],
    ["Q♠ Q♦ 9♥ 9♣",28,"QQ99"],
    ["A♠ K♦ Q♥ T♠",31,"AKQT suited ace"],
    ["A♠ 3♠ K♦ 4♦",30,"A34K double suited"],
    ["A♠ K♦ 7♥ 2♣",4,"AK only"],
    ["Q♠ 9♦ 4♥ 2♣",4,"Q9 two-gap connector"],
    ["7♠ 7♦ 2♥ 3♣",15,"small pair plus 23 connector"],
    ["A♠ A♦ A♥ K♣",4,"trips no pair points, AK connector only"]
  ];

  let html="";
  let pass=0;
  for(const [s,exp,name] of tests){
    const got=scoreHand(handFrom(s)).total;
    const ok=got===exp;
    if(ok) pass++;
    html += `<div>${ok?"✅":"❌"} ${name}: expected ${exp}, got ${got}</div>`;
  }

  // Fuzz test: make sure no random hand crashes.
  let fuzzOk=true;
  for(let i=0;i<5000;i++){
    const h=randomHand();
    const r=scoreHand(h);
    if(!Number.isFinite(r.total)){fuzzOk=false;break;}
  }
  html += `<p>${fuzzOk?"✅":"❌"} 5,000 random hands scored without crashing.</p>`;
  html = `<p><b>${pass}/${tests.length}</b> fixed tests passed.</p>` + html;
  document.getElementById("testOut").innerHTML=html;
}

buildSelectors();
setHand(handFrom("A♠ K♠ A♥ K♥"));
scoreSelected();
</script>
</body>
</html>
